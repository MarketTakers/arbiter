syntax = "proto3";

package arbiter;

import "auth.proto";
import "client.proto";
import "user_agent.proto";

message ServerInfo {
  string version = 1;
  bytes cert_public_key = 2;
}

service ArbiterService {
  rpc Client(stream ClientRequest) returns (stream ClientResponse);
  rpc UserAgent(stream UserAgentRequest) returns (stream UserAgentResponse);
}
