name: arbiter
description: "Useragent for Arbiter project"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_adaptive_scaffold:
    git: https://github.com/hdbg/flutter_adaptive_scaffold.git
  talker: ^5.1.15
  riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  sizer: ^3.1.3
  biometric_signature: ^10.2.0
  mtcore:
    hosted: https://git.markettakers.org/api/packages/MarketTakers/pub/
    version: ^1.0.6
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.0.0
  cryptography_flutter: ^2.3.4
  riverpod_annotation: ^4.0.0
  grpc: ^5.1.0
  flutter_hooks: ^0.21.3+1
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.12.2
  auto_route_generator: ^10.4.0

flutter:
  uses-material-design: true